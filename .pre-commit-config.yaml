# stylua only, deliberately scoped.
#
# Formatting is already handled on save by conform.nvim, which is why the nvim
# config was 51/52 clean before this existed. The gap this closes is narrow and
# specific: files edited OUTSIDE nvim -- by a script, by another editor, by an
# agent using sed -- never pass through format-on-save. That is exactly how
# dot_config/nvim/lua/r35/themes/candy/init.lua drifted 1,326 lines of indent.
#
# Deliberately NOT the full baseline from claude-config/templates/pre-commit:
# trailing-whitespace and end-of-file-fixer across 398 tracked files (222 of
# them fish) would produce a large first-run diff unrelated to anything here,
# and check-added-large-files defaults to 500 KB, which would reject the
# generated dot_config/nvim/lua/r35/glyphs/types.lua at 787 KB.
#
# rev is pinned to v2.5.2 to match the stylua mason installs for conform, so the
# hook and format-on-save can never disagree about output.
repos:
  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.5.2
    hooks:
      - id: stylua-github
        files: ^dot_config/nvim/.*\.lua$
        # Generated by scripts/gen_glyphs.lua; the generator rewrites them from
        # scratch, so formatting here is undone on the next regeneration.
        exclude: ^dot_config/nvim/lua/r35/glyphs/(data|types)\.lua$
