# vim: ft=kitty
#
# Candy-shop tab bar. The colours live in ../tab_bar.py -- position picks each
# tab's hue and the script paints every cell itself. The values here are the
# fallback: if tab_bar.py ever fails to import, kitty renders with these, and a
# readable neutral bar beats a broken one.

tab_bar_edge bottom
# tab bar styles are: fade, hidden, powerline, separator, slant, custom
tab_bar_style custom
tab_bar_align center
tab_separator ""

# tab_bar_style powerline
# powerline_styles are: angled, slanted, round
# tab_powerline_style slanted
# tab_powerline_style round

tab_bar_margin_width -1
tab_bar_margin_height 0 2

background #000000
selection_background #ebdbb2

# The counter the candy sits on. HSL(226, 41%, 10%) -- same navy hue as the old
# #141D3A but deeper and less saturated, so it reads as a neutral ground rather
# than competing with the pills. Every candy clears 10.6:1 against it.
# NOTE: window_title_bar.conf shares this value; change both together.
tab_bar_background #0F1424

# Margin matches the bar so it stops drawing a bright line under the tabs.
tab_bar_margin_color #0F1424

# Fallbacks only -- tab_bar.py replaces these per tab via DrawData._replace().
active_tab_background #2F3E56
active_tab_foreground #DCE3F2

inactive_tab_background #0F1424
inactive_tab_foreground #8794B2

# Leave tab_title_template at kitty's default. Its {fmt.fg.tab} resolves through
# draw_data.tab_fg(tab), which tab_bar.py swaps per tab, so the template renders
# in that tab's candy instead of overriding it.
