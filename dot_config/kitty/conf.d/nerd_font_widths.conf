# vim: ft=kitty
#
# Nerd Font glyphs, rendered at natural size in two cells.
#
# PragmataPro draws every Nerd Font glyph at 2048 units against its normal 1024
# -- exactly double width -- while wcwidth reports 1. kitty ignores font metrics
# for Private Use Area codepoints and scales them down to fit one cell, which is
# why most icons look compressed rather than broken. U+26A0 is NOT in the PUA, so
# kitty leaves its metrics alone, it draws at full 2x width, and the next cell
# clips it. Same root cause, two different symptoms.
#
# Giving them two cells renders them at their designed size: no clipping, no
# compression.
#
# IMPORTANT: neovim is told the same widths via vim.fn.setcellwidths() in
# lua/r35/glyphs/blocks.lua. The two lists MUST stay in sync or nvim and kitty will
# disagree about where text sits. Other TUIs still assume one cell, so if a
# shell prompt or another program looks misaligned, this file is why -- delete
# it and reload to revert.
#
# Powerline is deliberately absent: PragmataPro already draws U+E0A0-U+E0D7 at
# single width, and the tab bar's pill caps depend on that.

# Pomicons -- U+E009 and U+E00A measure 1024 units (one cell); the rest of the
# block is 2048. Declaring the whole block two cells left a dead half-cell.
narrow_symbols U+E000-U+E008 2
# Font Awesome Extension
narrow_symbols U+E200-U+E2A9 2
# Weather
narrow_symbols U+E300-U+E3E3 2
# Seti-UI / Custom
narrow_symbols U+E5FA-U+E6B7 2
# Devicons
narrow_symbols U+E700-U+E8EF 2
# Codicons
narrow_symbols U+EA60-U+EC1E 2
# Font Awesome
narrow_symbols U+ED00-U+F2FF 2
# Font Logos
narrow_symbols U+F300-U+F381 2
# Octicons
narrow_symbols U+F400-U+F533 2
# Material Design
narrow_symbols U+F0001-U+F1AF0 2
# Non-PUA codepoints PragmataPro nonetheless draws at 2048 units. They clip
# without this. U+23FD, U+2B58 and U+26A1 sit among these and measure 1024,
# which is why the ranges are split rather than declared wholesale. Measured
# with fontTools against PragmataProVF_liga_09.ttf; regenerate the comparison
# with: nvim -l scripts/gen_glyphs.lua --audit
# Timer clock
narrow_symbols U+23F2 2
# IEC power / toggle power
narrow_symbols U+23FB-U+23FC 2
# IEC sleep mode
narrow_symbols U+23FE 2
# Black heart suit
narrow_symbols U+2665 2
# Warning sign
narrow_symbols U+26A0 2
