# Splits!
map f5    launch --location=hsplit
map f6    launch --location=vsplit
map f4    launch --location=split
map alt+n launch --location=split

# Rotate the current split, changing its split axis from vertical to
# horizontal or vice versa
map f7 layout_action rotate

# Move WINDOW in direction
map shift+up    move_window up
map shift+left  move_window left
map shift+right move_window right
map shift+down  move_window down

# Move WINDOW to edge
map alt+shift+up    layout_action move_to_screen_edge top
map alt+shift+left  layout_action move_to_screen_edge left
map alt+shift+right layout_action move_to_screen_edge right
map alt+shift+down  layout_action move_to_screen_edge bottom

# Moving FOCUS
map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right

# Set the bias of the split containing the currently focused window. The
# currently focused window will take up the specified percent of its parent
# window's size.
map ctrl+. layout_action bias 80

# ZOOM horizontally (windows are minimized to left and right).
# Provided there are windows to the left or right of the active window.
map kitty_mod+alt+right layout_action maximize horizontal
map kitty_mod+alt+left  layout_action maximize horizontal

# ZOOM vertically (windows are minimized above and below)
# Provided there are windows above or below the active window.
map kitty_mod+alt+up    layout_action maximize vertical
map kitty_mod+alt+down  layout_action maximize vertical

# Equalize all splits so that windows share available space proportionally.
map kitty_mod+e layout_action equalize

# Other Defaults
# <C-S> l = next layout
